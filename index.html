<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nicaragua: departamentos y sitios históricos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f2a35;--panel:#f3efe6;--ink:#1d2b30;--mute:#5d6b70;--line:#d8d2c3;--hi:#ffd45e}
@media (prefers-color-scheme:dark){:root{--panel:#16353f;--ink:#eaf1ee;--mute:#9fb3b5;--line:#2c4d58}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);font-family:Figtree,system-ui,sans-serif;color:var(--ink);display:flex;overflow:hidden}
#stage{flex:1;position:relative;min-width:0}
svg{width:100%;height:100%;display:block}
.dep{stroke:#0f2a35;stroke-width:1.2;vector-effect:non-scaling-stroke;cursor:pointer;transition:opacity .5s,filter .2s,fill-opacity .5s}
.dep:hover,.dep.hl{filter:brightness(1.18)}
.dim .dep{opacity:.1;pointer-events:none}
.ghost{opacity:.35!important;fill-opacity:.15;stroke:#9fb3b5;stroke-dasharray:4 3}
#lift{transform-origin:0 0;filter:drop-shadow(0 18px 22px rgba(0,0,0,.45))}
#lift .dep{cursor:default;stroke:#fff;stroke-width:2}
.pin{cursor:pointer}.pin circle{fill:var(--hi);stroke:#13262d}
.pin text{fill:#fff;paint-order:stroke;stroke:#0f2a35;font-family:Figtree,sans-serif;font-weight:600;pointer-events:none}
.pin.on circle{fill:#fff}
#tip{position:absolute;pointer-events:none;background:#13262d;color:#fff;padding:4px 9px;border-radius:4px;font-size:14px;opacity:0;transition:opacity .15s}
#panel{width:380px;max-width:100%;background:var(--panel);overflow-y:auto;padding:24px 22px;border-left:1px solid var(--line)}
h1{font:700 26px/1.15 Bitter,Georgia,serif;margin:0 0 8px}
h2{font:700 24px/1.15 Bitter,Georgia,serif;margin:0 0 4px}
p{line-height:1.5;margin:0 0 12px}.mute{color:var(--mute);font-size:14px}
ul{list-style:none;margin:16px 0 0;padding:0}
li button{all:unset;display:flex;gap:10px;align-items:center;width:100%;padding:7px 4px;cursor:pointer;border-bottom:1px solid var(--line);font-size:15px}
li button:hover,li button:focus-visible{background:rgba(127,127,127,.15)}
.sw{width:14px;height:14px;border-radius:3px;flex:none}
.back{all:unset;cursor:pointer;color:var(--mute);font-size:14px;margin-bottom:14px;display:inline-block;text-decoration:underline}
.back:focus-visible,li button:focus-visible{outline:2px solid var(--hi)}
.sites button{all:unset;cursor:pointer;display:block;padding:8px 10px;border:1px solid var(--line);border-radius:6px;margin:0 6px 6px 0;font-size:14px}
.sites button.on{background:var(--ink);color:var(--panel)}
.card{margin-top:14px;border-top:3px solid var(--bar,#888);padding-top:14px}
.card img{width:100%;max-height:240px;object-fit:cover;border-radius:6px;display:block;margin-bottom:12px;background:rgba(127,127,127,.2)}
.noimg{padding:30px 10px;text-align:center;border:1px dashed var(--line);border-radius:6px;margin-bottom:12px}
.card a{color:inherit}
@media(max-width:800px){body{flex-direction:column}#stage{flex:none;height:56vh}#panel{width:100%;flex:1;border-left:0;border-top:1px solid var(--line)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="stage"><svg id="svg" role="img" aria-label="Mapa político de Nicaragua"><g id="map"></g><g id="lift"></g></svg><div id="tip"></div></div>
<aside id="panel" aria-live="polite"></aside>

MS:['Masaya','#ff7b9c',[['Fortaleza de Coyotepe',11.9440,-86.0870,'Fortaleza de Coyotepe','Construida en 1893; después fue prisión y hoy es museo.'],['Volcán Masaya',11.9847,-86.1706,'Volcán Masaya','En 1529 fray Francisco de Bobadilla colocó una cruz en el cráter.']]],
CA:['Carazo','#4cc9f0',[['Basílica de San Sebastián, Diriamba',11.8585,-86.2397,'Diriamba','El Güegüense fue declarado Patrimonio Oral e Intangible por la UNESCO en 2005.']]],
RI:['Rivas','#9b5de5',[['Batalla de Rivas (1856)',11.4333,-85.8333,'Batalla de Rivas','El 11 de abril de 1856 Juan Santamaría incendió el mesón ocupado por los filibusteros.'],['Isla de Ometepe',11.5167,-85.5833,'Isla de Ometepe','Isla de dos volcanes con petroglifos y estatuaria precolombina.']]]
};
const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id);
const svg=$('svg'),map=$('map'),lift=$('lift'),panel=$('panel'),tip=$('tip');
svg.setAttribute('viewBox',`0 0 ${P.W} ${P.H}`);
const mk=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
const proj=(la,lo)=>[(lo-P.lon0)*P.C*P.S+20,(P.lat1-la)*P.S+20];
const els={};let cur=null,busy=false,anim=null;
for(const k in D){const e=mk('path',{d:PATHS[k],fill:D[k][1],class:'dep',tabindex:0,role:'button','aria-label':D[k][0]},map);els[k]=e;
 e.onclick=()=>open(k);e.onkeydown=ev=>{if(ev.key=='Enter')open(k)};
 e.onmousemove=ev=>{const r=$('stage').getBoundingClientRect();tip.textContent=D[k][0];tip.style.opacity=1;tip.style.left=ev.clientX-r.left+14+'px';tip.style.top=ev.clientY-r.top+14+'px'};
 e.onmouseleave=()=>tip.style.opacity=0}
function home(){panel.innerHTML=`<h1>Nicaragua</h1><p>Toca un departamento para separarlo del mapa y ver sus sitios históricos.</p><p class="mute">15 departamentos y 2 regiones autónomas. Límites: geoBoundaries.</p><ul>${Object.keys(D).sort((a,b)=>D[a][0].localeCompare(D[b][0])).map(k=>`<li><button data-k="${k}"><span class="sw" style="background:${D[k][1]}"></span>${D[k][0]}</button></li>`).join('')}</ul>`;
 panel.querySelectorAll('li button').forEach(b=>{b.onclick=()=>open(b.dataset.k);b.onmouseenter=()=>els[b.dataset.k].classList.add('hl');b.onmouseleave=()=>els[b.dataset.k].classList.remove('hl')})}
function open(k){if(busy||cur)return;busy=true;cur=k;tip.style.opacity=0;
 const o=els[k],b=o.getBBox(),s=Math.min(P.W*.82/b.width,P.H*.82/b.height),cx=b.x+b.width/2,cy=b.y+b.height/2,tx=P.W/2-s*cx,ty=P.H/2-s*cy;
 const c=mk('path',{d:PATHS[k],fill:D[k][1],class:'dep'},lift);o.classList.add('ghost');map.classList.add('dim');
 lift._s=s;lift._t=[tx,ty];
 anim=lift.animate([{transform:'translate(0px,0px) scale(1)'},{transform:'translate(0px,-6px) scale(1.04)',offset:.15},{transform:`translate(${tx}px,${ty}px) scale(${s})`}],{duration:1100,easing:'cubic-bezier(.65,0,.25,1)',fill:'forwards'});
 anim.onfinish=()=>{busy=false;pins(k,s)};
 panel.innerHTML=`<button class="back" id="bk">← Todo el mapa</button><h2>${D[k][0]}</h2><p class="mute">Cargando sitios…</p>`;$('bk').onclick=close}
function pins(k,s){const sites=D[k][2];
 sites.forEach((t,i)=>{const [x,y]=proj(t[1],t[2]);const g=mk('g',{class:'pin',tabindex:0,role:'button','aria-label':t[0],transform:`translate(${x} ${y})`},lift);
  mk('circle',{r:8/s,'stroke-width':2/s},g);const tx=mk('text',{x:12/s,y:4/s,'font-size':14/s,'stroke-width':3/s},g);tx.textContent=t[0];
  g.animate([{opacity:0},{opacity:1}],{duration:350,delay:i*120,fill:'backwards'});
  g.onclick=()=>show(k,i);g.onkeydown=e=>{if(e.key=='Enter')show(k,i)}});
 show(k,0)}
const cache={};
async function wiki(t){if(cache[t])return cache[t];try{const r=await fetch('https://es.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(t.replace(/ /g,'_')));if(!r.ok)throw 0;const j=await r.json();return cache[t]={img:j.thumbnail&&j.thumbnail.source,txt:j.extract,url:j.content_urls&&j.content_urls.desktop.page}}catch(e){return cache[t]={}}}
async function show(k,i){const sites=D[k][2],t=sites[i];
 lift.querySelectorAll('.pin').forEach((g,n)=>g.classList.toggle('on',n==i));
 panel.innerHTML=`<button class="back" id="bk">← Todo el mapa</button><h2>${D[k][0]}</h2><div class="sites">${sites.map((s,n)=>`<button class="${n==i?'on':''}" data-n="${n}">${s[0]}</button>`).join('')}</div><div class="card" style="--bar:${D[k][1]}"><h3 style="margin:0 0 8px;font:700 19px Bitter,serif">${t[0]}</h3>${t[4]?`<p>${t[4]}</p>`:''}<div id="w" class="mute">Consultando Wikipedia…</div><p class="mute">Coordenadas aproximadas: ${t[1].toFixed(4)}, ${t[2].toFixed(4)}</p></div>`;
 $('bk').onclick=close;panel.querySelectorAll('.sites button').forEach(b=>b.onclick=()=>show(k,+b.dataset.n));
 const w=await wiki(t[3]);if(cur!=k||!$('w')||!panel.querySelector('.sites .on')||panel.querySelector('.sites .on').dataset.n!=i)return;
 const esc=s=>String(s).replace(/</g,'&lt;');
 $('w').outerHTML=(w.img?`<img src="${w.img}" alt="${esc(t[0])}">`:`<div class="noimg mute">Imagen no disponible (se requiere conexión a Internet).</div>`)+(w.txt?`<p>${esc(w.txt)}</p><p class="mute">Fuente: <a href="${w.url}" target="_blank" rel="noopener">Wikipedia</a></p>`:'<p class="mute">No se pudo cargar la reseña de Wikipedia.</p>')}
function close(){if(busy||!cur)return;busy=true;const k=cur;lift.querySelectorAll('.pin').forEach(p=>p.remove());
 anim.reverse();anim.onfinish=()=>{anim.cancel();lift.innerHTML='';els[k].classList.remove('ghost');map.classList.remove('dim');cur=null;busy=false;home()}}
document.addEventListener('keydown',e=>{if(e.key=='Escape')close()});
home();
</script></body></html>
